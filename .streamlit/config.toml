# Dark sidebar against a light main area. The chart palette was validated against the
# light surface, so inverting the whole app would mean re-picking and re-validating
# every series colour; confining the dark to the sidebar keeps that work valid.
[theme]
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
font = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "medium"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#1b2532"
secondaryBackgroundColor = "#2a3746"
textColor = "#e6e9ed"
primaryColor = "#5ba3f5"
showWidgetBorder = false
