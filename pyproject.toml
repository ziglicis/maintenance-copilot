[project]
name = "maintenance-copilot"
version = "0.1.0"
description = "Predictive maintenance copilot for turbofan engines (C-MAPSS FD001)"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "torch==2.5.1",
    "pydantic==2.10.3",
    "anthropic>=0.40",
    "streamlit==1.64.0",
    "plotly==5.24.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
